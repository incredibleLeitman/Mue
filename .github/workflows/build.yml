name: Build

# Push to main: export the web build and publish it on GitHub Pages.
# Push a tag v*, publish a release or run it by hand with a release_tag: also export Windows/Linux and attach all builds to the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a release with this tag (e.g. v1.0), leave empty for Pages only"
        required: false

env:
  GODOT_VERSION: 3.5.3

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux_headless.64 /usr/local/bin/godot
          curl -sSLo templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          T=~/.local/share/godot/templates/${GODOT_VERSION}.stable
          mkdir -p $T
          unzip -qjo templates.tpz templates/version.txt templates/webassembly_release.zip templates/windows_64_release.exe templates/linux_x11_64_release -d $T
          rm godot.zip templates.tpz
      - name: Export
        run: |
          mkdir -p build/web build/windows build/linux
          cd Project
          godot --no-window --export "HTML5" ../build/web/index.html
          godot --no-window --export "Windows" ../build/windows/Mu.exe
          godot --no-window --export "Linux" ../build/linux/Mu.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build

  pages:
    needs: export
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: build
      - name: Zip builds
        run: |
          cd build
          (cd web && zip -r ../Mu-web.zip .)
          (cd windows && zip -r ../Mu-windows.zip .)
          (cd linux && chmod +x Mu.x86_64 && zip -r ../Mu-linux.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
